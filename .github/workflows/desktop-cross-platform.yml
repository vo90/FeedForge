name: macOS decoder ABI diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9537275a0493e1dcbd28f0063fa14685e171b674
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install original build dependencies
        run: |
          npm ci
          python -m pip install ".[dev]"
          python -m pytest tests/test_macos_decoder_libraries.py -q
          brew install ffmpeg libogg libvorbis mpg123
      - name: Reproduce pinned decoder against current Homebrew
        shell: bash
        run: |
          mkdir -p decoder-diagnostics
          git rev-parse HEAD | tee decoder-diagnostics/source-sha.txt
          brew list --versions ffmpeg libogg libvorbis mpg123 | tee decoder-diagnostics/brew-before.txt
          python - <<'PY'
          import hashlib, shutil, stat, urllib.request, zipfile
          from pathlib import Path
          archive = Path('decoder-diagnostics/vgmstream-mac.zip')
          urllib.request.urlretrieve('https://github.com/vgmstream/vgmstream/releases/download/r2117/vgmstream-mac.zip', archive)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == 'cdabf633231a4556feb0048a71990c768e862f3695dd9458ae28e4d94aa50a99'
          tool = Path('src/feedback_converter/tools/vgmstream-cli')
          with zipfile.ZipFile(archive) as bundle:
              member = next(m for m in bundle.infolist() if Path(m.filename).name == 'vgmstream-cli')
              with bundle.open(member) as source, tool.open('wb') as target:
                  shutil.copyfileobj(source, target)
          tool.chmod(tool.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          PY
          decoder=src/feedback_converter/tools/vgmstream-cli
          otool -L "$decoder" | tee decoder-diagnostics/dependencies-before.txt
          status=0
          "$decoder" -h >decoder-diagnostics/help-before.txt 2>&1 || status=$?
          cat decoder-diagnostics/help-before.txt
          echo "Decoder status before repair: $status" | tee decoder-diagnostics/status-before.txt
          test "$status" -ge 126
      - name: Test compatible FFmpeg ABI without changing decoder version
        shell: bash
        run: |
          brew install ffmpeg@8
          python tools/prepare_macos_decoder.py src/feedback_converter/tools/vgmstream-cli "$(brew --prefix ffmpeg@8)"
          decoder=src/feedback_converter/tools/vgmstream-cli
          otool -L "$decoder" | tee decoder-diagnostics/dependencies-after.txt
          status=0
          "$decoder" -h >decoder-diagnostics/help-after.txt 2>&1 || status=$?
          cat decoder-diagnostics/help-after.txt
          echo "Decoder status after repair: $status" | tee decoder-diagnostics/status-after.txt
          test "$status" -lt 126
          grep -qi vgmstream decoder-diagnostics/help-after.txt
      - name: Build proposed fix commit with compatible decoder libraries
        run: npm run release:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify signature and standalone bundled decoder
        shell: bash
        run: |
          app=release/mac-arm64/FeedForge.app
          codesign --verify --deep --strict --verbose=2 "$app"
          find "$app" -name 'vgmstream-cli' -ls | tee decoder-diagnostics/bundled-decoder-paths.txt
          decoder="$(find "$app" -type f -path '*/feedback_converter/tools/vgmstream-cli' -print -quit)"
          test -n "$decoder"
          otool -L "$decoder" | tee decoder-diagnostics/bundled-dependencies.txt
          if grep -q /opt/homebrew decoder-diagnostics/bundled-dependencies.txt; then
            echo 'Bundled decoder still refers to Homebrew instead of bundled libraries.'
            exit 1
          fi
          status=0
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH "$decoder" -h >decoder-diagnostics/bundled-help.txt 2>&1 || status=$?
          cat decoder-diagnostics/bundled-help.txt
          echo "Bundled decoder status: $status" | tee decoder-diagnostics/bundled-status.txt
          test "$status" -lt 126
          grep -qi vgmstream decoder-diagnostics/bundled-help.txt
          python - <<'PY'
          import struct, wave
          with wave.open('decoder-diagnostics/synthetic-input.wav', 'wb') as output:
              output.setparams((1, 2, 8000, 800, 'NONE', 'not compressed'))
              output.writeframes(b''.join(struct.pack('<h', 1000 if i % 16 < 8 else -1000) for i in range(800)))
          PY
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH "$decoder" -o decoder-diagnostics/synthetic-decoded.wav decoder-diagnostics/synthetic-input.wav | tee decoder-diagnostics/decode-result.txt
          python - <<'PY'
          import wave
          with wave.open('decoder-diagnostics/synthetic-decoded.wav', 'rb') as decoded:
              assert decoded.getnchannels() == 1
              assert decoded.getframerate() == 8000
              assert decoded.getnframes() == 800
          print('Bundled decoder converted the synthetic audio successfully.')
          PY
          converter="$(find release -type f -path '*/bin/psarc2feedpak/psarc2feedpak' -print -quit)"
          test -n "$converter"
          expected="$(node -p "require('./package.json').version")"
          test "$("$converter" --version)" = "psarc2feedpak $expected"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-decoder-diagnostics
          path: decoder-diagnostics/*.txt
          if-no-files-found: error
