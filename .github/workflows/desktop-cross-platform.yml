name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win
            artifact: FeedForge-Windows-x64
            files: release/*.exe
          - os: macos-15
            platform: mac
            artifact: FeedForge-macOS-Apple-Silicon
            files: |
              release/*.dmg
              release/*.zip
          - os: ubuntu-24.04
            platform: linux
            artifact: FeedForge-Linux-x64
            files: release/*.AppImage
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          npm ci
          python -m pip install ".[dev]"

      - name: Install macOS decoder libraries
        if: runner.os == 'macOS'
        run: brew install ffmpeg libogg libvorbis mpg123

      - name: Bundle native WEM decoder
        run: python tools/install-vgmstream.py --force --destination src/feedback_converter/tools

      - name: Test
        run: |
          node --check electron/main.cjs
          node --test electron/*.test.cjs
          python -m compileall -q src tools/start-demucs-server.py
          python -m pytest -q
          npm run build

      - name: Build desktop app
        run: npm run release:${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Smoke-test bundled converter
        if: runner.os != 'Windows'
        shell: bash
        run: |
          converter="$(find release -type f -path '*/bin/psarc2feedpak/psarc2feedpak' -print -quit)"
          test -n "$converter"
          chmod +x "$converter"
          expected="$(node -p "require('./package.json').version")"
          test "$("$converter" --version)" = "psarc2feedpak $expected"

      - name: Verify macOS application signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/FeedForge.app
          decoder="$(find release/mac-arm64/FeedForge.app -type f -path '*/feedback_converter/tools/vgmstream-cli' -print -quit)"
          test -n "$decoder"
          status=0
          output="$("$decoder" -h 2>&1)" || status=$?
          test "$status" -lt 126
          grep -qi vgmstream <<<"$output"

      - name: Smoke-test bundled converter
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $converter = Get-ChildItem release -Recurse -Filter psarc2feedpak.exe |
            Where-Object FullName -Match '[\\/]bin[\\/]psarc2feedpak[\\/]' |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $converter) { throw 'Bundled converter was not found.' }
          $expected = node -p "require('./package.json').version"
          if ((& $converter --version) -ne "psarc2feedpak $expected") { throw 'Bundled converter version mismatch.' }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          name: FeedForge ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
