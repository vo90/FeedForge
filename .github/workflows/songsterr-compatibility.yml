name: Songsterr compatibility

on:
  pull_request:
  push:
    branches: ['feat/**', 'fix/**', 'integration/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install '.[dev]'
      # Synthetic fixtures only. No songs, media, profiles or player downloads.
      - run: python -m pytest -q tests/test_songsterr_compatibility_lab.py tests/test_songsterr_dotted_whole_rest.py tests/test_song_import_verification.py
      - run: node --test tests/js/songsterr-reference.test.cjs tests/js/songsterr-event-trace.test.cjs
